apiVersion: apps/v1
kind: Deployment
metadata:
  name: shownest-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shownest-web
  template:
    metadata:
      labels:
        app: shownest-web
    spec:
      containers:
      - name: web
        image: shownest/web:latest
        ports:
        - containerPort: 3000
